name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        moodle-branch: ['MOODLE_405_STABLE']
        database: [pgsql, mariadb]

    steps:
      - name: Clean previous test run artifacts
        run: rm -rf moodle moodledata plugin

      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Cache moodle-plugin-ci & Moodle Core
        uses: actions/cache@v6
        with:
          path: |
            ci
            ~/.moodle-plugin-ci
          key: ${{ runner.os }}-moodle-ci-${{ matrix.moodle-branch }}-${{ matrix.php }}

      - name: Initialise moodle-plugin-ci
        run: |
          if [ ! -d "ci" ]; then
            composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          fi
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          if ! command -v psql &> /dev/null || ! command -v mysql &> /dev/null || ! command -v locale-gen &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y locales postgresql-client default-mysql-client
          fi
          sudo locale-gen en_AU.UTF-8
          if [ ! -d "$HOME/.nvm" ]; then
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
          fi
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          # Uncomment this to run Behat tests using the Moodle App.
          # MOODLE_APP: 'true'

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      # - name: Moodle CodeSniffer Auto-fix
      #   if: ${{ !cancelled() }}
      #   run: |
      #     phpcbf --standard=moodle --extensions=php ./plugin || true

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 100

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 100

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      # - name: Mustache Lint
      #   if: ${{ !cancelled() }}
      #   run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Check if Behat tests exist
        id: check_behat
        if: ${{ !cancelled() }}
        run: |
          if [ -d "./plugin/tests/behat" ] && [ -n "$(ls -A ./plugin/tests/behat 2>/dev/null)" ]; then
            echo "has_behat=true" >> $GITHUB_OUTPUT
          else
            echo "has_behat=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Chrome dependencies
        if: ${{ !cancelled() && steps.check_behat.outputs.has_behat == 'true' }}
        run: |
          if ! dpkg -l | grep -q libnspr4; then
            sudo apt-get update && sudo apt-get install -y libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0 libpango-1.0-0 libgtk-3-0
          fi

      - name: Setup Chrome
        if: ${{ !cancelled() && steps.check_behat.outputs.has_behat == 'true' }}
        uses: browser-actions/setup-chrome@v2

      - name: Behat features
        id: behat
        if: ${{ !cancelled() && steps.check_behat.outputs.has_behat == 'true' }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outputs.has_behat == 'true' && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

